name: Apply uploaded store update

on:
  push:
    branches:
      - chatgpt-upload-20260910d

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-upload-20260910d
          fetch-depth: 0
      - name: Apply archive and publish main
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .update_payload/update.b64 > /tmp/satin-update.zip
          unzip -o /tmp/satin-update.zip -d .
          rm -rf .update_payload
          rm -f .github/workflows/apply-chatgpt-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply store overhaul and admin fixes"
          git push origin HEAD:main
